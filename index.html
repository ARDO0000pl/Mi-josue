<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Josue</title>
    <style>
        :root {
            --pink: #ff4d6d;
            --dark-red: #c9184a;
            --soft-bg: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--soft-bg);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Lluvia de corazones de fondo */
        .rain {
            position: fixed;
            top: -10%;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            width: 90%;
            max-width: 550px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            min-height: 280px;
        }

        /* --- Texto Animado --- */
        .lyrics {
            width: 55%;
            color: #5d4037;
            font-size: 1rem;
            line-height: 1.5;
            text-align: left;
        }

        .typewriter {
            display: block;
            overflow: hidden;
            white-space: normal;
            width: 0;
            margin-bottom: 12px;
            animation: typing 3s steps(40, end) forwards;
        }

        .d-1 { animation-delay: 1.5s; }
        .d-2 { animation-delay: 4.5s; }
        .d-3 { animation-delay: 8s; }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        /* --- Árbol a la derecha --- */
        .tree-container {
            position: relative;
            width: 40%;
            height: 250px;
        }

        .trunk {
            width: 14px;
            height: 0;
            background: #6d4c41;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
            animation: growTrunk 1.5s ease-out forwards;
        }

        @keyframes growTrunk {
            to { height: 90px; }
        }

        .heart-leaf {
            position: absolute;
            background-color: var(--pink);
            width: 12px;
            height: 12px;
            transform: rotate(-45deg) scale(0);
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .heart-leaf::before, .heart-leaf::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: inherit;
            border-radius: 50%;
        }
        .heart-leaf::before { top: -6px; left: 0; }
        .heart-leaf::after { left: 6px; top: 0; }

        @keyframes pop {
            to { transform: rotate(-45deg) scale(1); }
        }

        /* --- Contador y Pie --- */
        .footer {
            margin-top: 20px;
            border-top: 1px solid #ffccd5;
            padding-top: 15px;
            text-align: center;
        }

        #timer {
            font-size: 1rem;
            font-weight: bold;
            color: var(--dark-red);
            margin: 10px 0;
        }

        .love-msg {
            font-size: 1.8rem;
            color: var(--dark-red);
            font-weight: 900;
            margin-top: 15px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-section">
            <div class="lyrics">
                <span class="typewriter">Para el amor de mi vida:</span>
                <span class="typewriter d-1">Si pudiera elegir un lugar seguro, sería a tu lado.</span>
                <span class="typewriter d-2">Cuanto más tiempo estoy contigo, más te sigo amando...</span>
                <span class="typewriter d-3">A pesar de la distancia, mi corazón siempre te encuentra. ❤️</span>
            </div>

            <div class="tree-container" id="tree">
                <div class="trunk"></div>
            </div>
        </div>

        <div class="footer">
            <div style="color: #8d6e63;">Mi amor por ti comenzó hace...</div>
            <div id="timer">Calculando...</div>
            <div class="love-msg">JOSUE TE AMO ❤️</div>
        </div>
    </div>

    <script>
        // 1. Fecha: 12 de enero de 2026
        const startDate = new Date(2026, 0, 12, 0, 0, 0); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerHTML = 
                `${days} días ${hours} horas ${minutes} min ${seconds} seg`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 2. Árbol Frondoso (180 corazones)
        const tree = document.getElementById('tree');
        const colors = ['#ff4d6d', '#ff758f', '#c9184a', '#ffb3c1', '#fa3e5f', '#ff8fa3'];

        for (let i = 0; i < 180; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'heart-leaf';
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 85; 
            const x = Math.cos(angle) * radius + 55; 
            const y = Math.sin(angle) * (radius * 0.9) + 60;

            leaf.style.left = `${x}%`;
            leaf.style.top = `${y}px`;
            leaf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            leaf.style.animationDelay = `${0.5 + (Math.random() * 4)}s`;
            tree.appendChild(leaf);
        }

        // 3. Lluvia de corazones constante
        function createRain() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'rain';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createRain, 300);
    </script>
</body>
</html>
